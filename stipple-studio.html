<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Stipple Studio</title>
    <meta name="twitter:card" content="summary">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jett Pavlica's Portfolio">
    <meta property="og:image" content="https://jett.codes/assets/img/thumbnails/stipple-studio-cover.png">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Atkinson%20Hyperlegible%20Mono.css">
    <link rel="stylesheet" href="assets/css/playground/stipple-studio-styles.css">
    <link rel="stylesheet" href="assets/css/playground/slider-styles.css">
<script src="https://cdn.jsdelivr.net/npm/heic2any"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"
    integrity="sha512-3RlxD1bW34eFKPwj9gUXEWtdSMC59QqIqHnD8O/NoTwSJhgxRizdcFVQhUMFyTp5RwLTDL0Lbcqtl8b7bFAzog=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script src="https://unpkg.com/p5.js-svg@1.5.1"></script>
</head>

<body style="background-color: var(--pink);">
    <div id="app-container">
        <div id="generator-panel" class="control-panel"><a role="button" id="user-guide" href="stipple-studio-guide.html">User Guide</a>
            <p class="panel-element">Render Settings</p>
            <div id="slider-panel" class="subpanel panel-element">
                <div class="slider-holder panel-element"><input type="range" id="attempts-slider" class="panel-element" max="40" min="1" step="1"><label class="panel-element" for="attempts-slider">Attempts</label></div>
                <div class="slider-holder panel-element"><input type="range" id="radius-slider" class="panel-element" max="5" min="1" step="0.001"><label class="panel-element" for="radius-slider">Spawn Radius</label></div>
                <div class="slider-holder panel-element"><input type="range" id="lightness-slider" class="panel-element" max="25" min="1" step="1"><label class="panel-element" for="lightness-slider">Highlights</label></div>
                <div class="slider-holder panel-element"><input type="range" id="contrast-slider" class="panel-element" max="12" min="0" step="0.1"><label class="panel-element" for="contrast-slider">Shadows</label></div>
            </div>
            <p id="count-label" class="panel-element">Circles:<br>&nbsp;0</p>
            <div class="subpanel panel-element" style="gap:0px;">
                <p class="panel-element">Mode:</p><select id="draw-mode-dropdown" class="panel-element" name="draw-mode">
                    <option value="luminance">Luminance</option>
                    <option value="cmyk">C M Y K</option>
                </select>
            </div>
            <div id="button-panel" class="subpanel panel-element"><button id="user-regenerate" class="panel-element" type="button">Regenerate</button></div>
        </div>
        <div id="canvas-container">
            <h1 id="p5_loading">loading stipple studio...</h1>
        </div>
        <div id="export-panel" class="control-panel">
            <p>Upload &amp; Export</p><label class="custom-file-upload" for="file-upload"> Upload Image </label><button id="user-download-svg" type="button">Export SVG</button><button id="user-download-png" type="button">Export PNG</button>
        </div>
    </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/DensityPoissonSampler.js"></script>
    <script src="assets/js/DensityPoissonSketch.js"></script>
</body>

</html>
