<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Stiple Renderer</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Atkinson%20Hyperlegible%20Mono.css">
    <link rel="stylesheet" href="assets/css/playground/stipple-studio-styles.css">
    <link rel="stylesheet" href="assets/css/playground/slider-styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"
    integrity="sha512-3RlxD1bW34eFKPwj9gUXEWtdSMC59QqIqHnD8O/NoTwSJhgxRizdcFVQhUMFyTp5RwLTDL0Lbcqtl8b7bFAzog=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/p5.js-svg@1.5.1"></script>
</head>

<body style="background-color: var(--pink);">
    <div id="app-container">
        <div id="control-panel">
            <div id="slider-panel" class="subpanel">
                <div class="slider-holder"><input type="range" id="radius-slider" max="5" min="1" step="0.001"><label for="radius-slider">Radius</label></div>
                <div class="slider-holder"><input type="range" id="attempts-slider" max="40" min="1" step="1"><label for="attempts-slider">Attempts</label></div>
                <div class="slider-holder"><input type="range" id="contrast-slider" max="12" min="0" step="0.1"><label for="contrast-slider">Contrast</label></div>
                <div class="slider-holder"><input type="range" id="lightness-slider" max="25" min="1" step="1"><label for="lightness-slider">Lightness</label></div>
            </div>
            <p id="count-label">Circles:<br>&nbsp;0</p>
            <div class="subpanel" style="gap:0px;">
                <p>Mode:</p><select id="draw-mode-dropdown" name="draw-mode">
                    <option value="luminance">Luminance</option>
                    <option value="cmyk">C M Y K</option>
                </select>
            </div>
            <div id="button-panel" class="subpanel"><button type="button" id="user-regenerate">Regenerate</button><button type="button" id="user-download">Download SVG</button><label class="custom-file-upload" for="file-upload"> Upload Image </label></div>
        </div>
        <div id="canvas-container"></div>
    </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/DensityPoissonSampler.js"></script>
    <script src="assets/js/DensityPoissonSketch.js"></script>
</body>

</html>
