    <meta charset="utf-8">

    <title>Jett Pavlica</title>
    <meta name="twitter:card" content="summary">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jett Pavlica's Portfolio">
    <meta property="og:image" content="https://jett.codes/assets/img/headshot-in-pink.webp">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg"
        media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg">
    <link rel="icon" type="image/svg+xml" sizes="96x96" href="assets/img/new-sig.svg"
        media="(prefers-color-scheme: dark)">

<body id="body" style="background-color: var(--pink);">
    <main class="contact-main">
        <header class="contact-intro glass-card">
            <h1><span class="contact-intro-prefix">Want to</span> <span class="contact-rotating-word">create
                    together?</span>?</h1>
        </header>

        <form class="contact-form glass-card" data-bss-recipient="c106c11fec3c249bee99703eacfc7fcd"
            data-bss-success-title="Thanks for reaching out :)!">
            <div class="contact-field-row">
                <div class="contact-field">
                    <label for="contact-name">Name</label>
                    <input id="contact-name" name="Name" type="text" autocomplete="name" placeholder="your name"
                        required>
                </div>
                <div class="contact-field">
                    <label for="contact-email">Email</label>
                    <input id="contact-email" name="Email" type="email" autocomplete="email"
                        placeholder="you@example.com" required>
                </div>
            </div>
            <div class="contact-field">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="Message" placeholder="what's up?" required></textarea>
            </div>
            <input class="contact-submit btn glass-card" type="submit" value="Start a conversation">
        </form>

        <p class="contact-note">Projects, collaborations, commissions, and curious ideas are all welcome.</p>
    </main>
    <a class="home-button glass-card" href="index.html" aria-label="Back to home"><img class="img-fluid" width="548"
            height="550" src="assets/img/home-icon.webp"></a>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/smart-forms.min.js"></script>
    <script src="assets/js/background-shader.js"></script>
    <script src="assets/js/UserGradient.js"></script>
    <script src="assets/js/contact-headline.js"></script>
</body>

</html>
